<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique Kids &middot; Pague com Pix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #B2185C;
    --pink-dark: #8f1249;
    --pink-light: #E6407D;
    --blue: #5AAAD2;
    --blue-dark: #2f86b6;
    --blue-tint: #EAF5FC;
    --green: #22A559;
    --green-dark: #188a47;
    --whatsapp: #25D366;
    --cream: #FAFAFA;
  }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--cream);
  }

  .card {
    max-width: 380px;
    width: 100%;
    text-align: center;
    background: #ffffff;
    border-radius: 24px;
    padding: 32px 26px 28px;
    box-shadow: 0 10px 26px -10px rgba(0,0,0,0.12);
    border: 1px solid #f0f0f0;
    position: relative;
  }

  .logo {
    width: 168px;
    height: 168px;
    object-fit: contain;
    border-radius: 0;
    margin: -8px auto 6px;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.14));
    position: relative;
    z-index: 1;
  }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #222;
    margin-bottom: 2px;
  }

  .nome {
    font-family: 'Baloo 2', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--pink-dark);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .subtitulo {
    font-size: 13px;
    color: #a3a3a3;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
  }

  .chave-box {
    border: 2px dashed var(--blue);
    background: var(--blue-tint);
    border-radius: 16px;
    padding: 12px 16px 14px;
    margin-bottom: 20px;
    position: relative;
  }

  .chave-label {
    font-family: 'Baloo 2', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--blue-dark);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .chave-valor {
    font-size: 15px;
    color: #2b3a44;
    word-break: break-all;
    font-family: ui-monospace, monospace;
    font-weight: 600;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button, a.link {
    width: 100%;
    padding: 14px 18px;
    border: none;
    border-radius: 999px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.15s ease, opacity 0.15s;
  }

  button svg, a.link svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .btn-copiar {
    background: var(--green);
    box-shadow: 0 6px 14px -6px rgba(34,165,89,0.55);
  }
  .btn-copiar.copiado {
    background: var(--green-dark);
  }

  #btnWhatsapp {
    background: var(--whatsapp);
    box-shadow: 0 6px 14px -6px rgba(37,211,102,0.55);
  }

  #btnInstagram {
    background: var(--pink);
    box-shadow: 0 6px 14px -6px rgba(178,24,92,0.5);
  }

  a.link:hover, button:hover {
    opacity: 0.85;
  }
  a.link:active, button:active {
    transform: scale(0.98);
  }

  .link.oculto { display: none; }

  .aviso {
    font-size: 12px;
    color: #b3b3b3;
    margin-top: 20px;
    position: relative;
    z-index: 1;
  }

  .selo {
    display: inline-block;
    margin-top: 4px;
    font-size: 20px;
    position: relative;
    z-index: 1;
  }
</style>
</head>
